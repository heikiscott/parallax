# Agentic V3 Evaluation Pipeline
# V3 专属流程: Add → Search → Answer → Evaluate
# - 不包含 Cluster 阶段
# - Add 阶段只提取 MemUnit，不构建 BM25/Embedding 索引（由 retrieval.mode 控制）
# - Search 阶段使用 ColBERT 检索，按需构建 ColBERT 索引

workflow:
  name: "agentic_v3_evaluation_pipeline"
  description: "Agentic V3 - ColBERT retrieval without clustering"

  nodes:
    - name: "add"
      function: "eval_add_stage"
      config:
        use_checkpoint: true

    - name: "search"
      function: "eval_search_stage_v3"
      config:
        use_checkpoint: true

    - name: "answer"
      function: "eval_answer_stage"
      config:
        use_checkpoint: true

    - name: "evaluate"
      function: "eval_evaluate_stage"
      config:
        use_checkpoint: true

  edges:
    - from: "START"
      to: "add"
    - from: "add"
      to: "search"
    - from: "search"
      to: "answer"
    - from: "answer"
      to: "evaluate"
    - from: "evaluate"
      to: "END"
