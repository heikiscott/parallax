# Agentic V4 Evaluation Pipeline
# V4 专属流程: Add → Search → Answer → Evaluate
# - 不包含 Cluster 阶段
# - Add 阶段只提取 MemUnit，不构建 BM25/Embedding 索引
# - Search 阶段使用交叉注意力检索 (Cross-Attention)

workflow:
  name: "agentic_v4_evaluation_pipeline"
  description: "Agentic V4 - Cross-Attention retrieval without clustering"

  nodes:
    - name: "add"
      function: "eval_add_stage"
      config:
        use_checkpoint: true

    - name: "search"
      function: "eval_search_stage_v4"
      config:
        use_checkpoint: true

    - name: "answer"
      function: "eval_answer_stage"
      config:
        use_checkpoint: true

    - name: "evaluate"
      function: "eval_evaluate_stage"
      config:
        use_checkpoint: true

  edges:
    - from: "START"
      to: "add"
    - from: "add"
      to: "search"
    - from: "search"
      to: "answer"
    - from: "answer"
      to: "evaluate"
    - from: "evaluate"
      to: "END"
