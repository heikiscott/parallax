# Parallax System Configuration
# 完整的 Parallax 评估系统配置

name: "parallax"
version: "1.0"
description: "Parallax Memory System"
adapter: "parallax"

# ===== 基础配置 =====
experiment_name: "locomo_evaluation"
dataset_path: "data/locomo10.json"
num_conv: 10  # 对话数量

# ===== LLM 配置 =====
llm:
  service: "openai"  # openai | vllm
  openai:
    provider: "openai"
    model: "gpt-4.1-mini"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    temperature: 0
    max_tokens: 32768
  vllm:
    provider: "openai"
    model: "Qwen3-30B"
    base_url: "http://0.0.0.0:8000/v1"
    api_key: "123"
    temperature: 0
    max_tokens: 32768

# ===== MemUnit 提取配置 =====
extraction:
  enable_semantic: false      # 是否启用语义记忆提取
  enable_clustering: false    # 是否启用聚类
  enable_profile: false       # 是否启用 Profile 提取

  clustering:
    similarity_threshold: 0.65
    max_time_gap_days: 7.0

  profile:
    scenario: "assistant"     # group_chat | assistant
    min_confidence: 0.6
    min_memunits: 1

# ===== 群体事件聚类配置 (Group Event Cluster) =====
group_event_cluster:
  enabled: true
  llm_provider: "openai"
  llm_model: null             # null 表示使用主 LLM 配置
  llm_api_key: null
  llm_base_url: null
  llm_temperature: 0.0
  summary_update_threshold: 5
  max_clusters_in_prompt: 20
  max_members_per_cluster_in_prompt: 3

# ===== 群体事件聚类检索配置 =====
group_event_cluster_retrieval:
  enabled: true
  # 可选策略: insert_after_hit, append_to_end, merge_by_score, replace_rerank, cluster_rerank
  expansion_strategy: "cluster_rerank"
  # 通用扩展参数
  max_expansion_per_hit: 3
  max_total_expansion: 10
  expansion_budget_ratio: 0.3
  prefer_time_adjacent: true
  time_window_hours: null
  expansion_score_decay: 0.7
  deduplicate_expanded: true
  rerank_after_expansion: false
  rerank_top_n_after_expansion: 20
  # cluster_rerank 策略专用配置
  cluster_rerank_max_clusters: 10
  cluster_rerank_max_members_per_cluster: 15
  cluster_rerank_total_max_members: 30

# ===== 检索配置 =====
retrieval:
  mode: "agentic_v4"          # agentic | agentic_v2 | agentic_v3 | agentic_v4 | lightweight | workflow
  workflow_name: "adaptive_retrieval"

  use_emb: true
  use_reranker: true
  use_agentic: true
  use_multi_query: true
  use_hybrid_search: true

  # 召回数量
  emb_recall_top_n: 40
  reranker_top_n: 20

  # 混合检索参数
  hybrid:
    emb_candidates: 50
    bm25_candidates: 50
    rrf_k: 40

  # 轻量级检索参数 (retrieval.mode=lightweight)
  lightweight:
    bm25_top_n: 50
    emb_top_n: 50
    final_top_n: 20

  # 多查询检索参数 (use_multi_query=true)
  multi_query:
    num: 3
    top_n: 50

  # ===== Agentic V2 配置 (retrieval.mode=agentic_v2) =====
  # V2 在 Round 1 就基于问题类型生成 Multi-Query，提升首轮召回率
  # MemUnit 数量约 37-93 个/conv，平均 ~67 个，参数已针对此规模调优
  agentic_v2:
    # Multi-Query 决策配置
    skip_high_confidence_types: true   # 高置信度简单问题跳过 Multi-Query
    confidence_threshold: 0.85         # 置信度阈值
    num_queries: 3                     # 每轮生成的 query 数量

    # Round 1 默认配置 (会被 type_retrieval_configs 覆盖)
    round1_per_query_top_n: 20         # 每个 query 返回的候选数 (3×20≈60)
    round1_fusion_top_n: 20            # RRF 融合后保留的候选数
    round1_rerank_top_n: 10            # Sufficiency Check 使用的 Top N

    # Round 2 默认配置 (会被 type_retrieval_configs 覆盖)
    round2_per_query_top_n: 30         # Round 2 每个 query 返回更多候选
    round2_fusion_top_n: 30            # Round 2 RRF 融合后保留数
    final_rerank_top_n: 20             # 最终 Rerank 返回的 Top N

  # ===== 问题类型召回配置矩阵 =====
  # 每种问题类型可独立配置各环节的召回数量，实现精细化控制
  type_retrieval_configs:
    # --- 简单问题 - 保守配置，减少噪声 ---
    attribute_identity:
      round1_per_query_top_n: 20
      round1_fusion_top_n: 20
      round1_rerank_top_n: 10
      round2_per_query_top_n: 30
      round2_fusion_top_n: 30
      merge_budget: 30
      final_rerank_top_n: 20

    attribute_preference:
      round1_per_query_top_n: 20
      round1_fusion_top_n: 20
      round1_rerank_top_n: 10
      round2_per_query_top_n: 30
      round2_fusion_top_n: 30
      merge_budget: 30
      final_rerank_top_n: 20

    attribute_location:
      round1_per_query_top_n: 20
      round1_fusion_top_n: 20
      round1_rerank_top_n: 10
      round2_per_query_top_n: 30
      round2_fusion_top_n: 30
      merge_budget: 30
      final_rerank_top_n: 20

    # --- 中等问题 - 适中配置 ---
    event_activity:
      round1_per_query_top_n: 20
      round1_fusion_top_n: 20
      round1_rerank_top_n: 10
      round2_per_query_top_n: 30
      round2_fusion_top_n: 30
      merge_budget: 35
      final_rerank_top_n: 20

    general:
      round1_per_query_top_n: 20
      round1_fusion_top_n: 20
      round1_rerank_top_n: 10
      round2_per_query_top_n: 30
      round2_fusion_top_n: 30
      merge_budget: 35
      final_rerank_top_n: 20

    # --- 时间相关问题 - 需要更多证据 ---
    event_temporal:
      round1_per_query_top_n: 25
      round1_fusion_top_n: 25
      round1_rerank_top_n: 12
      round2_per_query_top_n: 35
      round2_fusion_top_n: 35
      merge_budget: 40
      final_rerank_top_n: 20

    event_aggregation:
      round1_per_query_top_n: 25
      round1_fusion_top_n: 25
      round1_rerank_top_n: 12
      round2_per_query_top_n: 35
      round2_fusion_top_n: 35
      merge_budget: 40
      final_rerank_top_n: 20

    time_calculation:
      round1_per_query_top_n: 25
      round1_fusion_top_n: 25
      round1_rerank_top_n: 12
      round2_per_query_top_n: 35
      round2_fusion_top_n: 35
      merge_budget: 40
      final_rerank_top_n: 20

    # --- 复杂问题 - 激进配置，更多召回 ---
    counting:
      round1_per_query_top_n: 30
      round1_fusion_top_n: 30
      round1_rerank_top_n: 15
      round2_per_query_top_n: 40
      round2_fusion_top_n: 40
      merge_budget: 45
      final_rerank_top_n: 25

    reasoning_hypothetical:
      round1_per_query_top_n: 30
      round1_fusion_top_n: 30
      round1_rerank_top_n: 15
      round2_per_query_top_n: 40
      round2_fusion_top_n: 40
      merge_budget: 45
      final_rerank_top_n: 25

    reasoning_inference:
      round1_per_query_top_n: 30
      round1_fusion_top_n: 30
      round1_rerank_top_n: 15
      round2_per_query_top_n: 40
      round2_fusion_top_n: 40
      merge_budget: 45
      final_rerank_top_n: 25

    # --- 默认配置 (fallback) ---
    default:
      round1_per_query_top_n: 20
      round1_fusion_top_n: 20
      round1_rerank_top_n: 10
      round2_per_query_top_n: 30
      round2_fusion_top_n: 30
      merge_budget: 35
      final_rerank_top_n: 20

  # ===== Agentic V3 配置 (retrieval.mode=agentic_v3) =====
  # V3 使用纯 ColBERT 检索替代 Embedding + BM25 + RRF
  # 经过 conv7 测试，发现参数需要与 V2 持平才能保证召回率
  agentic_v3:
    # Multi-Query 配置 (与 V2 相同)
    skip_high_confidence_types: true
    confidence_threshold: 0.85
    num_queries: 3

    # ColBERT 检索默认配置 (与 V2 完全一致)
    round1_top_n: 20          # 与 V2 一致
    round2_top_n: 30          # 与 V2 一致
    merge_budget: 35          # 与 V2 一致
    final_top_n: 20           # 与 V2 一致
    rrf_k: 60                 # RRF 融合参数

  # ===== V3 问题类型召回配置矩阵 =====
  # 经过 conv7 测试调优，参数与 V2 持平以保证召回率
  v3_type_retrieval_configs:
    # --- 简单问题：与 V2 完全一致 ---
    attribute_identity:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 30
      final_top_n: 20

    attribute_preference:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 30
      final_top_n: 20

    attribute_location:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 30
      final_top_n: 20

    # --- 中等问题：与 V2 完全一致 ---
    event_activity:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 35
      final_top_n: 20

    general:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 35
      final_top_n: 20

    # --- 时间/聚合问题：与 V2 完全一致 ---
    event_temporal:
      round1_top_n: 25
      round2_top_n: 35
      merge_budget: 40
      final_top_n: 20

    event_aggregation:
      round1_top_n: 25
      round2_top_n: 35
      merge_budget: 40
      final_top_n: 20

    time_calculation:
      round1_top_n: 25
      round2_top_n: 35
      merge_budget: 40
      final_top_n: 20

    # --- 复杂问题：与 V2 完全一致 ---
    counting:
      round1_top_n: 30
      round2_top_n: 40
      merge_budget: 45
      final_top_n: 25

    reasoning_hypothetical:
      round1_top_n: 30
      round2_top_n: 40
      merge_budget: 45
      final_top_n: 25

    reasoning_inference:
      round1_top_n: 30
      round2_top_n: 40
      merge_budget: 45
      final_top_n: 25

    # --- 默认配置：与 V2 完全一致 ---
    default:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 35
      final_top_n: 20

  # ===== Agentic V4 配置 (retrieval.mode=agentic_v4) =====
  # V4 使用交叉注意力检索替代 ColBERT
  # 注意：交叉注意力的 cross_attention_score() 函数需要由 ML 团队实现
  agentic_v4:
    # Multi-Query 配置
    skip_high_confidence_types: true
    confidence_threshold: 0.85
    num_queries: 3

    # 检索默认参数
    round1_top_n: 20
    round2_top_n: 30
    merge_budget: 35
    final_top_n: 20
    rrf_k: 60

    # 智能截断配置 (减少 Answer 阶段噪声)
    smart_truncate:
      enabled: true           # 是否启用智能截断
      min_results: 12         # 最少保留结果数
      max_results: 50         # 最多保留结果数
      score_ratio: 0.4        # 最低分数比例 (相对于最高分)
      gap_threshold: 0.35     # 分数断崖检测阈值 (更宽松)

  # ===== V4 问题类型召回配置矩阵 =====
  # V4 独立配置，可以单独调参
  v4_type_retrieval_configs:
    # --- 简单问题 ---
    attribute_identity:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 30
      final_top_n: 20
      # 智能截断: 简单问题
      truncate_min: 10
      truncate_max: 40
      truncate_score_ratio: 0.45

    attribute_preference:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 30
      final_top_n: 20
      truncate_min: 10
      truncate_max: 40
      truncate_score_ratio: 0.45

    attribute_location:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 30
      final_top_n: 20
      truncate_min: 10
      truncate_max: 40
      truncate_score_ratio: 0.45

    # --- 中等问题 ---
    event_activity:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 35
      final_top_n: 20
      # 时间/活动问题容易丢分，需要更多上下文
      truncate_min: 12
      truncate_max: 50
      truncate_score_ratio: 0.4

    general:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 35
      final_top_n: 20
      truncate_min: 12
      truncate_max: 50
      truncate_score_ratio: 0.4

    # --- 时间/聚合问题 ---
    event_temporal:
      round1_top_n: 25
      round2_top_n: 35
      merge_budget: 40
      final_top_n: 20
      # 时间问题容易丢分，需要更多上下文
      truncate_min: 12
      truncate_max: 50
      truncate_score_ratio: 0.35

    event_aggregation:
      round1_top_n: 25
      round2_top_n: 35
      merge_budget: 40
      final_top_n: 20
      # 聚合问题需要更多上下文
      truncate_min: 15
      truncate_max: 55
      truncate_score_ratio: 0.35

    time_calculation:
      round1_top_n: 25
      round2_top_n: 35
      merge_budget: 40
      final_top_n: 20
      truncate_min: 12
      truncate_max: 45
      truncate_score_ratio: 0.4

    # --- 复杂问题 ---
    counting:
      round1_top_n: 30
      round2_top_n: 40
      merge_budget: 45
      final_top_n: 25
      # 计数问题需要更多上下文
      truncate_min: 15
      truncate_max: 55
      truncate_score_ratio: 0.35

    reasoning_hypothetical:
      round1_top_n: 30
      round2_top_n: 40
      merge_budget: 45
      final_top_n: 25
      # 推理问题需要更广的上下文
      truncate_min: 12
      truncate_max: 50
      truncate_score_ratio: 0.35

    reasoning_inference:
      round1_top_n: 30
      round2_top_n: 40
      merge_budget: 45
      final_top_n: 25
      truncate_min: 12
      truncate_max: 50
      truncate_score_ratio: 0.35

    # --- 默认配置 (fallback) ---
    # 截断参数不需要在这里配置，会自动使用 agentic_v4.smart_truncate 的默认值
    default:
      round1_top_n: 20
      round2_top_n: 30
      merge_budget: 35
      final_top_n: 20

# ===== 问题分类配置 =====
question_classification:
  enabled: true
  classifier_type: "rule_based"   # rule_based | llm
  default_strategy: "gec_insert_after_hit"
  log_classification: true
  strategy_overrides: {}

# ===== Reranker 配置 =====
reranker:
  batch_size: 20
  max_retries: 10
  retry_delay: 0.8
  timeout: 60.0
  fallback_threshold: 0.3
  concurrent_batches: 5
  instruction: "Determine if the passage contains specific facts, entities (names, dates, locations), or details that directly answer the question."

# ===== Response 生成配置 =====
response:
  top_k: 20                   # 从检索结果中选择前 k 个构建 context
  answer_prompt_module: "prompts.memory.en.eval.answer.answer_prompts_v3"  # V1/V2/V3 切换只需改这里

# ===== 并发配置 =====
concurrency:
  extraction: ${EVAL_EXTRACTION_MAX_CONCURRENT:5}   # Stage1
  indexing: ${EVAL_INDEXING_MAX_CONCURRENT:5}       # Stage2
  retrieval: ${EVAL_RETRIEVAL_MAX_CONCURRENT:5}     # Stage3
  response: ${EVAL_RESPONSE_MAX_CONCURRENT:5}       # Stage4
  judgment: ${EVAL_JUDGMENT_MAX_CONCURRENT:5}       # Stage5

# ===== 批处理配置 =====
batch:
  embedding_size: 256         # Stage2: Embedding API 批次大小
  response_chunk: 200         # Stage4: 每次处理的 QA 数量
  response_save_interval: 400 # Stage4: checkpoint 保存间隔

# ===== API 重试配置 =====
api:
  max_retries: 20
  max_concurrent_requests: 10
